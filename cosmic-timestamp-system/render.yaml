services:
  - type: web
    name: cosmic-timestamp-system
    env: python
    buildCommand: "cd cosmic-timestamp-system && pip install -r requirements.txt"
    startCommand: "cd cosmic-timestamp-system && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 wsgi:app"
    startCommand: "cd cosmic-timestamp-system && gunicorn --bind 0.0.0.0:$PORT --workers 2 src.04_build_web_demo:app"

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0