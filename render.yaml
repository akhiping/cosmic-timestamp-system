services:
  - type: web
    name: cosmic-timestamp-system
    env: python
    rootDirectory: cosmic-timestamp-system
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
